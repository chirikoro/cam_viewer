[package]
name = "cam_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
